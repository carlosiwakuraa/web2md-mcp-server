<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Fixture admonition-class</title>
</head>
<body>
<h1>Avisos por classe</h1>
<aside class="note"><p>Anotação simples.</p></aside>
<div class="admonition tip"><p>Dica útil.</p></div>
<div class="callout important"><p>Isto é importante.</p></div>
<div class="admonition warning"><p>Cuidado com isto.</p></div>
<div class="callout caution"><p>Perigo!</p></div>
</body>
</html>
