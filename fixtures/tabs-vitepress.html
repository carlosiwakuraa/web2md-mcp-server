<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Getting Started</title></head>
<body>
<h1>Getting Started</h1>
<p>Install the package with your favorite package manager:</p>
<div class="vp-code-group vp-adaptive-theme">
  <div class="tabs">
    <input type="radio" name="group-1" id="tab-a1" checked><label data-title="npm" for="tab-a1">npm</label>
    <input type="radio" name="group-1" id="tab-a2"><label data-title="pnpm" for="tab-a2">pnpm</label>
    <input type="radio" name="group-1" id="tab-a3"><label data-title="yarn" for="tab-a3">yarn</label>
  </div>
  <div class="blocks">
    <div class="language-sh vp-adaptive-theme active"><button title="Copy Code" class="copy"></button><span class="lang">sh</span><pre class="shiki shiki-themes github-light github-dark vp-code" tabindex="0"><code><span class="line"><span>$ npm add -D vitepress</span></span></code></pre></div>
    <div class="language-sh vp-adaptive-theme"><button title="Copy Code" class="copy"></button><span class="lang">sh</span><pre class="shiki shiki-themes github-light github-dark vp-code" tabindex="0"><code><span class="line"><span>$ pnpm add -D vitepress</span></span></code></pre></div>
    <div class="language-sh vp-adaptive-theme"><button title="Copy Code" class="copy"></button><span class="lang">sh</span><pre class="shiki shiki-themes github-light github-dark vp-code" tabindex="0"><code><span class="line"><span>$ yarn add -D vitepress</span></span></code></pre></div>
  </div>
</div>
<p>Then create the first page.</p>
</body>
</html>
