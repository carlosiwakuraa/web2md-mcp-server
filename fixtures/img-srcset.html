<html lang="pt-BR">

<meta charset="utf-8">
<title>Fixture img-srcset</title>
</head>
<body>
<h1>Srcset</h1>
<p><img src="" srcset="pequena.png 480w, grande.png 1200w, media.png 800w" alt="Largura"></p>
<p><img srcset="a.png 1x, a@2x.png 2x" alt="Densidade"></p>
<p><img src="fixa.png" srcset="outra.png 2x" alt="Com src"></p>
</body>
